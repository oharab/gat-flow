[project]
name = "google-workspace-ooo"
version = "0.1.0"
description = "Python script for managing out-of-office messages in Google Workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-auth>=2.17.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.88.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
google-ooo = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "ISC", "ICN", "G", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = [
    "S101",     # asserts allowed
    "PLR0913",  # too many arguments
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "T201",     # print() — CLI uses print for user-facing output; logging migration deferred
    "TRY003",   # long messages in raise — readability over rule
    "TRY300",   # try/else style — noise
    "RUF001",   # ambiguous unicode — emojis in user-facing strings are intentional
    "FBT001",   # boolean positional arg — Click flags are inherently boolean
    "FBT002",   # boolean default arg — same as above
    "RUF012",   # mutable class attr SCOPES — intentional
    "A001",     # `set` is a Click command name; rebinding builtin is intentional
    "A002",     # `type` as parameter name — Click option name
    "PLC0415",  # imports not at top of file — local imports are fine
    "RET504",   # unnecessary assignment before return — readability
    "SLF001",   # private member access — limited intentional use
    "PTH107",   # os.remove vs Path.unlink — cosmetic
    "PTH123",   # open() vs Path.open() — cosmetic
    "SIM105",   # contextlib.suppress vs try/except — explicit is clearer here
    "COM812",   # conflicts with ruff formatter
    "ISC001",   # conflicts with ruff formatter
]

[tool.ruff.lint.per-file-ignores]
"main.py" = [
    "BLE001",  # CLI top-level exception handlers intentionally catch Exception
    "ARG001",  # Click decorators require ctx/user args even if unused
    "E501",    # long user-facing strings (help text, info messages)
]
"auth.py" = ["E501"]    # long user-facing prompt strings
"config.py" = ["E501"]  # long lines in sample env-file content
"tests/*" = [
    "ARG002",   # pytest fixtures may be used for side effects only
    "PLR2004",  # magic numbers in test assertions are usually expected values
    "S105",     # hardcoded strings in tests are not real secrets
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"